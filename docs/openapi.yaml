        - obat_id
        - nama_obat
        - distributor_id
        - nama_distributor
        - nomor_batch
        - tanggal_masuk
        - tanggal_kedaluwarsa
        - jumlah_awal
        - jumlah_saat_ini
        - harga_beli_satuan
        - nilai_total
