openapi: "3.0.3"
info:
  title: "SIMAAF REST API"
  description: "Kontrak REST API untuk Sistem Pemantauan Stok dan Kedaluwarsa (SIMAAF) Apotek Asahan Farma."
  version: "1.1.0"
  contact:
    name: "Tim Pengembang Apotek Asahan Farma"
    email: "apotek.asahanfarma@gmail.com"
servers:
  - url: "/api/v1"
    description: "API Gateway SIMAAF Versi 1"

security:
  - bearerAuth: []

tags:
  - name: "Autentikasi & Sesi"
    description: "Pengelolaan sesi pengguna, verifikasi kredensial, dan otorisasi peran"
  - name: "Dashboard & Telemetri"
    description: "Metrik eksekutif, valuasi persediaan, evaluasi model Random Forest (AUC 0.91), dan peringkat risiko PBF"
  - name: "Inventori & Batch"
    description: "Manajemen katalog batch obat, filter multi-dimensi, dan pengurutan FEFO"
  - name: "Pengingat & Retur"
    description: "Peringatan retur mendesak (<30 hari), kedaluwarsa (<90 hari), stok menipis, dan penerbitan BAP fisik"
  - name: "Penyesuaian Stok (Stock Opname)"
    description: "Audit fisik rak apotek, kalkulasi variansi 3-pod, pemindaian kartu stok AI, dan buku audit trail"
  - name: "Faktur & AI Vision"
    description: "Unggah faktur fisik, ekstraksi OCR multimodal Gemini Vision, dan pendaftaran batch atomik"
  - name: "Kalender Tenggat"
    description: "Visualisasi jadwal jatuh tempo bulanan dan ekspor berkas standar iCalendar RFC 5545 (.ics)"
  - name: "Pengaturan & Master Data"
    description: "Profil sarana apotek, matriks kebijakan 14 PBF, katalog 18 obat, pencadangan dan pemulihan data"

paths:
  /auth/login:
    post:
      tags:
        - "Autentikasi & Sesi"
      summary: "Autentikasi Pengguna & Penerbitan JWT"
      description: "Memvalidasi surel dan kata sandi petugas apotek, mengembalikan token JWT dan profil pengguna aktif."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Autentikasi berhasil"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "Permintaan tidak valid (surel atau kata sandi kosong)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "401":
          description: "Kredensial tidak valid atau akun tidak aktif"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /auth/me:
    get:
      tags:
        - "Autentikasi & Sesi"
      summary: "Pemeriksaan Sesi Aktif"
      description: "Memverifikasi validitas token JWT aktif dan mengembalikan data identitas pengguna yang sedang login."
      responses:
        "200":
          description: "Sesi valid dan profil berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  pesan:
                    type: string
                    example: "Profil sesi aktif berhasil dimuat"
                  data:
                    $ref: "#/components/schemas/Pengguna"
        "401":
          description: "Token tidak disertakan, tidak valid, atau kedaluwarsa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /auth/logout:
    post:
      tags:
        - "Autentikasi & Sesi"
      summary: "Penghentian Sesi Pengguna"
      description: "Mencabut token sesi aktif dan mencatat log keluar sistem."
      responses:
        "200":
          description: "Logout berhasil"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  pesan:
                    type: string
                    example: "Logout berhasil"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /dashboard/ringkasan:
    get:
      tags:
        - "Dashboard & Telemetri"
      summary: "Ringkasan Metrik Eksekutif & Telemetri AI"
      description: "Menghitung total nilai persediaan, aset berisiko hangus, rasio kepatuhan FEFO, evaluasi model Random Forest Capstone Asah (AUC 0.91), dan peringkat ancaman 14 PBF. Wajib peran admin."
      parameters:
        - name: tanggal_acuan
          in: query
          required: false
          description: "Tanggal acuan tolok ukur simulasi (format YYYY-MM-DD)"
          schema:
            type: string
            format: date
            default: "2026-10-31"
      responses:
        "200":
          description: "Metrik dashboard berhasil dihitung"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardRingkasanResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "403":
          description: "Ditolak: Hanya pengguna dengan peran admin yang berhak mengakses"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /dashboard/analisis-ds:
    get:
      tags:
        - "Dashboard & Telemetri"
      summary: "Temuan Kualitatif Analisis Data Science"
      description: "Menyajikan wawasan strategis analitik dan rekomendasi optimasi stok dari model prediktif."
      responses:
        "200":
          description: "Wawasan data science berhasil dimuat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalisisDsResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /batches:
    get:
      tags:
        - "Inventori & Batch"
      summary: "Daftar Batch Inventori Obat"
      description: "Mengambil daftar batch obat aktif di rak apotek dengan filter multi-dimensi dan pengurutan kepatuhan FEFO."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          required: false
          description: "Pencarian teks pada nama obat atau nomor batch"
          schema:
            type: string
        - name: distributor_id
          in: query
          required: false
          description: "Penyaringan berdasarkan distributor PBF tertentu"
          schema:
            type: integer
        - name: status_risiko
          in: query
          required: false
          schema:
            type: string
            enum: [semua, rendah, sedang, tinggi]
            default: semua
        - name: status_retur
          in: query
          required: false
          schema:
            type: string
            enum: [semua, bisa_diretur, lewat_batas, tidak_bisa_diretur]
            default: semua
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [tanggal_kedaluwarsa, batas_retur, skor_risiko, nilai_total, nama_obat]
            default: tanggal_kedaluwarsa
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: tanggal_acuan
          in: query
          required: false
          schema:
            type: string
            format: date
            default: "2026-10-31"
      responses:
        "200":
          description: "Daftar batch inventori berhasil diambil"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchListResponse"
        "400":
          description: "Parameter filter tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /batches/{id}:
    get:
      tags:
        - "Inventori & Batch"
      summary: "Detail Profil Batch & Riwayat Audit Rak"
      description: "Mengambil data lengkap batch obat tertentu beserta linimasa riwayat stock opname pada batch tersebut."
      parameters:
        - name: id
          in: path
          required: true
          description: "ID numerik unik batch obat"
          schema:
            type: integer
      responses:
        "200":
          description: "Detail batch berhasil dimuat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetailResponse"
        "404":
          description: "Batch obat tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /pengingat:
    get:
      tags:
        - "Pengingat & Retur"
      summary: "Pemantauan Pengingat Retur & Peringatan Stok"
      description: "Menghitung pengelompokan batch mendesak retur (<30 hari), mendekati kedaluwarsa (<90 hari), dan stok menipis (<=10 unit) terhadap tanggal acuan."
      parameters:
        - name: tanggal_acuan
          in: query
          required: false
          schema:
            type: string
            format: date
            default: "2026-10-31"
      responses:
        "200":
          description: "Data pengingat dan peringatan stok berhasil dikalkulasi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PengingatResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /retur/bap:
    post:
      tags:
        - "Pengingat & Retur"
      summary: "Penerbitan Berita Acara Retur Fisik Resmi (BAP-RETUR)"
      description: "Menerbitkan lembar BAP resmi berstandar CDOB BPOM untuk sejumlah batch obat terpilih, mencantumkan KOP surat sarana, nomor izin SIA/SIPA, dan total nilai finansial klaim."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturBapRequest"
      responses:
        "200":
          description: "Dokumen BAP resmi berhasil diterbitkan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturBapResponse"
        "201":
          description: "Dokumen BAP resmi berhasil dibuat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturBapResponse"
        "400":
          description: "Daftar batch kosong atau data tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "404":
          description: "Salah satu batch tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /penyesuaian-stok:
    post:
      tags:
        - "Penyesuaian Stok (Stock Opname)"
      summary: "Pencatatan Penyesuaian Fisik Rak & Audit Trail"
      description: "Mencatat hasil hitungan fisik rak etalase, menghitung deviasi matematis selisih stok (sesudah - sebelum), memutakhirkan kuantitas batch, dan membukukan log audit."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PenyesuaianStokRequest"
      responses:
        "200":
          description: "Penyesuaian stok berhasil disimpan dan dicatat di buku audit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PenyesuaianStokResponse"
        "400":
          description: "Permintaan tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "404":
          description: "Batch obat tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "422":
          description: "Nilai stok fisik bernilai negatif"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /penyesuaian-stok/riwayat:
    get:
      tags:
        - "Penyesuaian Stok (Stock Opname)"
      summary: "Riwayat Audit Trail Penyesuaian Stok"
      description: "Mengambil daftar kronologis riwayat seluruh transaksi penyesuaian stock opname rak apotek."
      parameters:
        - name: batch_id
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: "Riwayat penyesuaian stok berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockLogItem"

  /penyesuaian-stok/scan-kartu:
    post:
      tags:
        - "Penyesuaian Stok (Stock Opname)"
      summary: "Pindai Kartu Stok Fisik via AI Vision"
      description: "Mengekstrak angka sisa stok fisik dari citra foto kartu stok gantung rak menggunakan Gemini Multimodal OCR."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file_kartu
              properties:
                file_kartu:
                  type: string
                  format: binary
                  description: "Berkas foto kartu stok (JPG, PNG, WEBP, maks. 5 MB)"
      responses:
        "200":
          description: "Foto kartu stok berhasil dipindai oleh model ekstraksi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanKartuResponse"
        "400":
          description: "Berkas bukan citra gambar valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "413":
          description: "Ukuran berkas melebihi 5 MB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "422":
          description: "Citra buram atau angka tidak terdeteksi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /faktur/ekstraksi:
    post:
      tags:
        - "Faktur & AI Vision"
      summary: "Ekstraksi OCR Faktur Fisik via AI Vision"
      description: "Menerima foto lembaran faktur pengiriman obat dari PBF, melakukan pemindaian OCR terstruktur via Gemini Multimodal Vision untuk nomor faktur, PBF, dan tabel item obat."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file_faktur
              properties:
                file_faktur:
                  type: string
                  format: binary
                  description: "Berkas citra lembar faktur pengiriman PBF (JPG, PNG, WEBP, maks. 5 MB)"
      responses:
        "200":
          description: "Foto faktur berhasil dipindai oleh model ekstraksi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FakturEkstraksiResponse"
        "400":
          description: "Berkas bukan gambar valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "413":
          description: "Ukuran berkas melebihi 5 MB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "422":
          description: "Gambar buram atau tidak terbaca (disertai penanda alihkan_ke_manual: true)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "503":
          description: "Layanan AI Vision mengalami timeout atau kuota habis"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /faktur/simpan-batch:
    post:
      tags:
        - "Faktur & AI Vision"
      summary: "Pendaftaran Atomik Batch Obat Baru dari Faktur"
      description: "Menyimpan kumpulan sediaan obat hasil verifikasi koreksi faktur secara atomik, secara otomatis menghitung batas retur PBF, mengevaluasi status retur, dan menjalankan inferensi skor risiko Machine Learning."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BatchCreateItem"
      responses:
        "201":
          description: "Kumpulan batch obat berhasil didaftarkan ke inventori"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSimpanResponse"
        "400":
          description: "Data batch tidak valid (kuantitas <= 0 atau tanggal exp lampau)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "422":
          description: "Obat ID atau distributor ID tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /kalender/milestones:
    get:
      tags:
        - "Kalender Tenggat"
      summary: "Daftar Tonggak Jatuh Tempo Retur & Kedaluwarsa Bulanan"
      description: "Mengambil daftar seluruh kejadian kritis jatuh tempo retur dan kedaluwarsa pada bulan dan tahun tertentu."
      parameters:
        - name: bulan
          in: query
          required: true
          description: "Bulan kalender (1 - 12)"
          schema:
            type: integer
            example: 11
        - name: tahun
          in: query
          required: true
          description: "Tahun kalender (contoh: 2026)"
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: "Daftar kejadian milestones bulanan berhasil dimuat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"

  /kalender/export.ics:
    get:
      tags:
        - "Kalender Tenggat"
      summary: "Ekspor Berkas Kalender Standar RFC 5545 (.ics)"
      description: "Mengunduh berkas kalender MIME text/calendar (.ics) berisi agenda jatuh tempo retur dan kedaluwarsa obat untuk sinkronisasi ke Google Calendar / Outlook."
      parameters:
        - name: bulan
          in: query
          required: false
          schema:
            type: integer
        - name: tahun
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: "Berkas kalender .ics berhasil digenerate"
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Apotek Asahan Farma//SIMAAF Kalender 1.0//ID\n..."

  /pengaturan:
    get:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pemuatan Konfigurasi Sistem Apotek"
      description: "Mengambil parameter acuan global sistem, tanggal simulasi, dan ambang batas peringatan operasional."
      responses:
        "200":
          description: "Pengaturan sistem berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PengaturanSistem"
    put:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pembaruan Parameter Operasional Sistem"
      description: "Memperbarui parameter konfigurasi apotek dan ambang batas pengingat. Wajib peran admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PengaturanSistem"
      responses:
        "200":
          description: "Pengaturan sistem berhasil diperbarui"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  pesan:
                    type: string
                    example: "Pengaturan sistem berhasil diperbarui"
                  data:
                    $ref: "#/components/schemas/PengaturanSistem"
        "403":
          description: "Ditolak: Hanya admin yang dapat mengubah pengaturan sistem"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /distributor:
    get:
      tags:
        - "Pengaturan & Master Data"
      summary: "Direktori Master 14 PBF & Kebijakan Retur"
      description: "Menampilkan daftar 14 Pedagang Besar Farmasi rekanan resmi Apotek Asahan Farma dan matriks aturan bulan returnya."
      responses:
        "200":
          description: "Daftar distributor PBF berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DistributorItem"

  /pengaturan/aturan-retur/{distributor_id}:
    put:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pembaruan Aturan Bulan Retur PBF & Rekalkulasi Berantai Batch"
      description: "Memperbarui aturan klausul bulan retur PBF tertentu dan secara otomatis menghitung ulang batas retur seluruh batch aktif yang berelasi di database. Wajib peran admin."
      parameters:
        - name: distributor_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AturanReturUpdateRequest"
      responses:
        "200":
          description: "Aturan retur distributor berhasil diperbarui dan batch terkait dihitung ulang"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AturanReturUpdateResponse"
        "403":
          description: "Ditolak: Hanya admin yang dapat mengubah aturan retur distributor"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "404":
          description: "Distributor tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /obat:
    get:
      tags:
        - "Pengaturan & Master Data"
      summary: "Katalog Master 18 Sediaan Obat Farmasi"
      description: "Mengambil katalog 18 master sediaan obat apotek lengkap dengan kode referensi, kategori terapeutik, satuan, safety stock, dan harga jual konsumen."
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: kategori
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Master obat berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  pesan:
                    type: string
                    example: "Master obat berhasil dimuat"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ObatItem"

  /pengaturan/profil-apotek:
    get:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pemuatan Profil Legalitas Sarana Apotek"
      description: "Mengambil informasi legalitas apotek (SIA, SIPA, NIB), penanggung jawab, KOP surat, dan kontak sarana."
      responses:
        "200":
          description: "Profil apotek berhasil dimuat"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProfilApotek"
    put:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pembaruan Profil Legalitas Sarana Apotek"
      description: "Memperbarui profil apotek, legalitas izin perizinan, dan format penomoran BAP. Wajib peran admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilApotek"
      responses:
        "200":
          description: "Profil sarana apotek berhasil diperbarui"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sukses:
                    type: boolean
                    example: true
                  pesan:
                    type: string
                    example: "Profil sarana apotek berhasil diperbarui"
                  data:
                    $ref: "#/components/schemas/ProfilApotek"
        "403":
          description: "Ditolak: Hanya admin yang dapat mengubah profil apotek"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /pengaturan/backup:
    post:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pencadangan Penuh Basis Data Sistem (JSON Dump)"
      description: "Mengekspor arsip data komprehensif seluruh tabel basis data SIMAAF dengan validasi checksum SHA-256. Wajib peran admin."
      responses:
        "200":
          description: "Pencadangan basis data berhasil dibuat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResponse"
        "403":
          description: "Ditolak: Akses dicadangkan untuk admin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

  /pengaturan/restore:
    post:
      tags:
        - "Pengaturan & Master Data"
      summary: "Pemulihan Basis Data dari Arsip Cadangan"
      description: "Memulihkan seluruh tabel basis data dari arsip dump JSON dengan verifikasi integritas checksum SHA-256 dan rollback atomik jika gagal. Wajib peran admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: "Basis data SIMAAF berhasil dipulihkan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "400":
          description: "Berkas arsip rusak atau checksum tidak cocok"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"
        "403":
          description: "Ditolak: Akses pemulihan hanya untuk admin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandarGalatResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Masukkan token JWT dengan format: Bearer <token>"

  schemas:
    Pengguna:
      type: object
      required:
        - id
        - nama
        - email
        - role
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: "Ibu Anni (Komisaris)"
        email:
          type: string
          format: email
          example: "admin@apotek.local"
        role:
          type: string
          enum: [admin, karyawan]
          example: "admin"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@apotek.local"
        password:
          type: string
          format: password
          example: "admin123"

    LoginResponse:
      type: object
      required:
        - sukses
        - pesan
        - data
      properties:
        sukses:
          type: boolean
          example: true
        pesan:
          type: string
          example: "Login berhasil"
        data:
          type: object
          required:
            - token
            - pengguna
          properties:
            token:
              type: string
              example: "mock-jwt-admin-token"
            pengguna:
              $ref: "#/components/schemas/Pengguna"

    ModelAiTelemetri:
      type: object
      required:
        - nama_model
        - auc_score
        - akurasi
        - status_evaluasi
      properties:
        nama_model:
          type: string
          example: "Random Forest Classifier"
        auc_score:
          type: number
          format: float
          example: 0.91
        akurasi:
          type: number
          format: float
          example: 0.885
        status_evaluasi:
          type: string
          example: "Optimal - Terverifikasi Capstone Asah 2026"

    DistributorTerancamItem:
      type: object
      required:
        - nama
        - nilai
        - batch_count
      properties:
        nama:
          type: string
          example: "PBF Enseval Putera Megatrading"
        nilai:
          type: number
          format: double
          example: 1092000.0
        batch_count:
          type: integer
          example: 1
        aturan_retur_bulan:
          type: integer
          example: 3

    DashboardRingkasanResponse:
      type: object
      required:
        - sukses
        - pesan
        - data
      properties:
        sukses:
          type: boolean
          example: true
        pesan:
          type: string
          example: "Ringkasan metrik dashboard berhasil dikalkulasi"
        data:
          type: object
          required:
            - tanggal_acuan
            - total_nilai_persediaan
            - total_batch_aktif
            - jumlah_batch_berisiko
            - total_nilai_berisiko
            - persentase_berisiko
            - kepatuhan_fefo_persen
            - model_ai_telemetri
            - distributor_terancam
          properties:
            tanggal_acuan:
              type: string
              format: date
              example: "2026-10-31"
            total_nilai_persediaan:
              type: number
              format: double
              example: 5614500.0
            total_batch_aktif:
              type: integer
              example: 8
            jumlah_batch_berisiko:
              type: integer
              example: 4
            total_nilai_berisiko:
              type: number
              format: double
              example: 2315000.0
            persentase_berisiko:
              type: number
              format: float
              example: 41.2
            kepatuhan_fefo_persen:
              type: number
              format: float
              example: 87.5
            model_ai_telemetri:
              $ref: "#/components/schemas/ModelAiTelemetri"
            distributor_terancam:
              type: array
              items:
                $ref: "#/components/schemas/DistributorTerancamItem"

    DashboardAnalisisDsResponse:
      type: object
      required:
        - sukses
        - pesan
        - data
      properties:
        sukses:
          type: boolean
          example: true
        pesan:
          type: string
          example: "Analisis kualitatif data science berhasil dimuat"
        data:
          type: object
          required:
            - temuan_ds
            - rekomendasi_tindakan
          properties:
            temuan_ds:
              type: array
              items:
                type: string
              example:
                - "Distributor dengan aturan retur singkat (1 bulan) menyumbang 62% obat yang gagal diretur."
                - "Obat antibiotik dan sirup anak memerlukan pemantauan ketat menjelang pergantian bulan."
                - "Semua estimasi risiko dihitung otomatis menggunakan model klasifikasi tim Asah 2026 (AUC 0.91)."
            rekomendasi_tindakan:
              type: array
              items:
                type: string
              example:
                - "Negosiasi perpanjangan klausul retur PBF Bina Farma dari 1 bulan menjadi minimal 3 bulan."
                - "Prioritaskan penggunaan fitur OCR Faktur AI untuk percepatan entri dalam 24 jam barang diterima."
                - "Lakukan bundling resep untuk sediaan slow-moving dengan skor risiko di atas 0.80."

