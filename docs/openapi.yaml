          type: integer
          example: 3
        nama_obat:
          type: string
          example: "Cefixime 100mg Kapsul"
        distributor_id:
          type: integer
          example: 4
        nama_distributor:
          type: string
          example: "PBF Enseval Putera Megatrading"
        nomor_batch:
          type: string
          example: "CFX-2601-A"
        tanggal_masuk:
          type: string
          format: date
          example: "2026-01-15"
        tanggal_kedaluwarsa:
          type: string
          format: date
          example: "2027-02-15"
        batas_retur:
          type: string
          format: date
          nullable: true
          example: "2026-11-15"
        jumlah_awal:
          type: integer
